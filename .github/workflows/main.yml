name: Blokada 5 CI
run-name: Build ${{ github.sha }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install pinned NDK
        run: |
          set -euo pipefail
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fo sdk-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q sdk-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          # Runner images rotate their preinstalled NDKs, so install the one app/build.gradle pins.
          ndk_version="$(sed -n 's/^ *ndkVersion "\(.*\)"$/\1/p' app/build.gradle)"
          if [ -z "$ndk_version" ]; then
            echo "Could not read ndkVersion from app/build.gradle" >&2
            exit 1
          fi
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${ndk_version}"

      - name: Set up environment variables
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ndk_version}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ndk_version}" >> $GITHUB_ENV

      - name: Create local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > ./local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/${ndk_version}" >> ./local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Test and build unsigned APK
        run: ./gradlew --no-daemon testFiveDebugUnitTest assembleFiveRelease

      - name: Lint
        run: ./gradlew --no-daemon :app:lint

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install DNS test dependencies
        run: python -m pip install --upgrade pip && pip install "dnspython" "httpx[http2]"

      - name: Run host DNS checks (non-blocking, upstream servers may be down)
        run: |
          chmod +x tools/ci/test_dns.py
          ./tools/ci/test_dns.py --kotlin-path app/src/main/java/repository/DnsDataSource.kt
        continue-on-error: true

      - name: Verify unsigned APK
        id: verify
        env:
          EXPECTED_PACKAGE: org.blokada.origin.alarm
        run: |
          set -euo pipefail

          mapfile -t apks < <(find app/build/outputs/apk/five/release -maxdepth 1 -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned release APK, found ${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" unsigned.apk

          build_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          zipalign="$build_tools/zipalign"
          for tool in "$apksigner" "$aapt" "$zipalign"; do
            if [ ! -x "$tool" ]; then
              echo "Android SDK tool is unavailable: $tool" >&2
              exit 1
            fi
          done

          if "$apksigner" verify unsigned.apk >/dev/null 2>&1; then
            echo "Build unexpectedly produced a signed APK" >&2
            exit 1
          fi
          "$zipalign" -c -P 16 -v 4 unsigned.apk
          unzip -Z1 unsigned.apk > apk-entries.txt
          if grep -Fxq 'assets/adi-registration.properties' apk-entries.txt; then
            echo "Developer verification registration must not be included in a release build" >&2
            exit 1
          fi

          "$aapt" dump badging unsigned.apk > badging.txt
          badging="$(head -1 badging.txt)"
          package_name="$(sed -n "s/.*package: name='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$badging")"
          if [ "$package_name" != "$EXPECTED_PACKAGE" ]; then
            echo "Unexpected package: $package_name" >&2
            exit 1
          fi

          sha256sum unsigned.apk > unsigned.apk.sha256
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg package_name "$package_name" \
            --arg version_name "$version_name" \
            --arg version_code "$version_code" \
            --arg build_tools_version "$(basename "$build_tools")" \
            '{source_sha: $source_sha, run_id: $run_id, run_attempt: $run_attempt, package_name: $package_name, version_name: $version_name, version_code: $version_code, build_tools_version: $build_tools_version}' \
            > build-metadata.json

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-${{ github.run_id }}
          path: |
            unsigned.apk
            unsigned.apk.sha256
            build-metadata.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Summarize build
        run: |
          {
            echo "### Unsigned build"
            echo "- Version: \`${{ steps.verify.outputs.version_name }}\`"
            echo "- Version code: \`${{ steps.verify.outputs.version_code }}\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Build run: \`$GITHUB_RUN_ID\`, attempt \`$GITHUB_RUN_ATTEMPT\`"
            echo ""
            echo "Download the unsigned-apk artifact to sideload, or sign locally with your own key."
          } >> "$GITHUB_STEP_SUMMARY"
